<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>appmospherics</title>
<meta name="description" content="Learn your best environment. Measure the places you spend time and see which ones support you.">
<meta name="theme-color" content="#F7F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1A25" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="appmospherics">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F9; --surface: #FFFFFF; --ink: #2E2C29; --muted: #5F5A66; --line: #E6E1EC;
  --accent: #3E2D5C; --accent-ink: #FFFFFF; --accent-soft: #ECE6F3;
  /* Score scale, light to dusk: Good is the pale Sky lavender, Caution a violet-gray, Poor deep dusk. Words always go with the colors. */
  --green: #CDBBDD; --amber: #9A97A0; --red: #3A3940; --none: #DAD6DF; --none-ink: #2E2C29;
  --brand: #CDBBDD; --brand-ink: #2E2C29; --wm-light: #6B6862;
  /* Patterns: only Good match is filled (Sky); the other quadrants stay quiet */
  --grid: #ECE7F1; --worst: #E3E2E1; --band: rgba(205,187,221,0.55); --flag: #3A3940;
  --q-match: #2E2C29; --q-hidden: #5F5A66; --q-despite: #5F5A66; --q-avoid: #5F5A66;
  --q-match-tint: #CDBBDD; --q-hidden-tint: transparent; --q-despite-tint: transparent; --q-avoid-tint: #ECE7F1;
  --display: "Archivo", "Atkinson Hyperlegible", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1A25; --surface: #2A2533; --ink: #F3EFF7; --muted: #C2B9CE; --line: #3A3445;
    --accent: #D2BDF0; --accent-ink: #1E1A25; --accent-soft: #3A3148;
    --green: #CDBBDD; --amber: #A3A0A8; --red: #4A4950; --none: #4A4553; --none-ink: #F3EFF7;
    --brand: #CDBBDD; --brand-ink: #2E2C29; --wm-light: #ABA79F;
    --grid: #322E3A; --worst: #343336; --band: rgba(205,187,221,0.3); --flag: #D9CCEB;
    --q-match: #2E2C29; --q-hidden: #B8AFC4; --q-despite: #B8AFC4; --q-avoid: #B8AFC4;
    --q-match-tint: #CDBBDD; --q-hidden-tint: transparent; --q-despite-tint: transparent; --q-avoid-tint: #322E3A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1A25; --surface: #2A2533; --ink: #F3EFF7; --muted: #C2B9CE; --line: #3A3445;
  --accent: #D2BDF0; --accent-ink: #1E1A25; --accent-soft: #3A3148;
  --green: #CDBBDD; --amber: #A3A0A8; --red: #4A4950; --none: #4A4553; --none-ink: #F3EFF7;
  --brand: #CDBBDD; --brand-ink: #2E2C29; --wm-light: #ABA79F;
  --grid: #322E3A; --worst: #343336; --band: rgba(205,187,221,0.3); --flag: #D9CCEB;
  --q-match: #2E2C29; --q-hidden: #B8AFC4; --q-despite: #B8AFC4; --q-avoid: #B8AFC4;
  --q-match-tint: #CDBBDD; --q-hidden-tint: transparent; --q-despite-tint: transparent; --q-avoid-tint: #322E3A;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1:focus { outline: none; }

.app { max-width: 560px; margin: 0 auto; padding: 0 20px 120px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; flex: none; border-radius: 8px; }
.wordmark { font-family: var(--display); font-weight: 500; font-stretch: 85%; font-size: 26px; line-height: 1; letter-spacing: -0.015em; margin: 0; color: var(--wm-light); }
.wordmark span { color: var(--ink); font-weight: 800; }
.tagline { display: block; font-family: var(--display); font-size: 10px; font-weight: 700; letter-spacing: 0.16em; color: var(--muted); margin-top: 3px; }
.mode-note { font-size: 13px; color: var(--muted); }

h1, h2, h3 { font-family: var(--display); font-stretch: 90%; letter-spacing: -0.015em; line-height: 1.12; margin: 0 0 8px; }
h1 { font-size: 32px; font-weight: 700; }
h2 { font-size: 24px; font-weight: 700; }
h3 { font-size: 19px; font-weight: 500; }
p { margin: 0 0 12px; max-width: 34em; }
ol { margin: 0; padding-left: 22px; }
ol li + li { margin-top: 6px; }
ul.keypoints { margin: 0; padding-left: 20px; }
ul.keypoints li + li { margin-top: 10px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.center { text-align: center; margin-left: auto; margin-right: auto; }
.stack > * + * { margin-top: 16px; }
.block-gap { margin-top: 28px; }
.hidden { display: none !important; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px; border-radius: 999px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }
.btn.quiet { background: transparent; color: var(--accent); }
.btn.danger { background: transparent; border-color: var(--red); color: var(--red); }
.btn.wide { width: 100%; }
.btn.compact { padding: 0 16px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.row { display: flex; gap: 10px; align-items: center; }
.row.spread { justify-content: space-between; }
.row.middle { justify-content: center; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.listitem { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
.listitem + .listitem { margin-top: 8px; }
.listitem .grow { flex: 1; min-width: 0; }
.listitem .title, .listitem .sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.listitem .title { font-weight: 700; }
.listitem .sub { font-size: 14px; color: var(--muted); }
.listitem .num { font-family: var(--display); font-weight: 700; font-size: 20px; }

.dot { width: 14px; height: 14px; border-radius: 4px; flex: none; background: var(--none); display: inline-block; }
.dot.green { background: var(--green); }
.lvlbar { width: 10px; align-self: stretch; min-height: 36px; border-radius: 5px; flex: none; background: var(--none); }
.lvlbar.green { background: var(--green); } .lvlbar.yellow { background: var(--amber); } .lvlbar.red { background: var(--red); }
.lvl { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
.lvl .dot { width: 18px; height: 18px; } .dot.yellow { background: var(--amber); } .dot.red { background: var(--red); }
button.dot { border: 0; padding: 0; width: 24px; height: 24px; cursor: pointer; }

label.field { display: block; font-weight: 700; margin-bottom: 6px; }
input[type="text"], input[type="number"], input[type="search"], select { width: 100%; min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
input:focus, select:focus { border-color: var(--accent); outline: none; }

/* Questions */
.q { padding: 18px 0; border-top: 1px solid var(--line); }
.q:first-child { border-top: 0; }
.q .prompt { font-weight: 700; margin-bottom: 4px; }
.q .hint { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
.q .extra { margin-top: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { min-height: 46px; min-width: 46px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg.scale { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; }
.seg.scale button { min-width: 0; padding: 0; }
.ends { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-top: 6px; }

input[type="range"] { width: 100%; height: 44px; accent-color: var(--accent); background: transparent; margin: 0; }
.slider.unset input[type="range"] { opacity: 0.4; }
.slider .val { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--accent); min-width: 2.5em; text-align: right; }
.slider .ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 6px; margin-top: -6px; }
.slider .ticks span { width: 0; display: flex; justify-content: center; }
.slider .state { font-size: 14px; color: var(--muted); min-height: 1.5em; }

details.more { border: 1px dashed var(--line); border-radius: 14px; padding: 4px 16px; }
details.more summary { cursor: pointer; font-weight: 700; padding: 12px 0; color: var(--accent); }
details.more .inside { padding-bottom: 14px; }

/* The atmosphere ring: the one expressive element */
.ring-wrap { display: grid; place-items: center; margin: 18px 0 8px; }
.ring { width: min(260px, 72vw); height: auto; display: block; }
.ring .halo { fill: none; stroke: var(--accent-soft); stroke-width: 2; }
.ring .track { fill: none; stroke: var(--line); stroke-width: 6; }
.ring .progress { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 0.2s linear; }
.ring .core { fill: var(--accent-soft); transform-origin: 50% 50%; transition: transform 0.15s ease-out; }
.ring text { font-family: var(--display); fill: var(--ink); }
.ring.green .progress { stroke: var(--green); } .ring.yellow .progress { stroke: var(--amber); } .ring.red .progress { stroke: var(--red); }
.ring.green .core { fill: color-mix(in srgb, var(--green) 18%, var(--surface)); }
.ring.yellow .core { fill: color-mix(in srgb, var(--amber) 24%, var(--surface)); }
.ring.red .core { fill: color-mix(in srgb, var(--red) 18%, var(--surface)); }
.ring-button { background: none; border: 0; padding: 0; cursor: pointer; display: block; border-radius: 50%; }
/* Home: a soft horizon below the header (the header itself stays on the plain page): sky, blush, a thin streak of light. Decorative only. */
body.ambient::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 600px; z-index: 0; pointer-events: none;
  background: linear-gradient(180deg, var(--bg) 0px, var(--bg) 64px, #D4C4E6 130px, #E2D6EE 230px, #F1E3EC 322px, #F7E6CC 350px, #EFE6F4 366px, rgba(247,245,249,0) 470px); }
body.ambient .app { position: relative; z-index: 1; }
body.ambient .topbar { background: transparent; position: relative; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.ambient::before { background: linear-gradient(180deg, var(--bg) 0px, var(--bg) 64px, #3B3052 130px, #4E3F68 240px, #6E5B8A 325px, #9A82AE 352px, rgba(30,26,37,0) 430px); } }
:root[data-theme="dark"] body.ambient::before { background: linear-gradient(180deg, var(--bg) 0px, var(--bg) 64px, #3B3052 130px, #4E3F68 240px, #6E5B8A 325px, #9A82AE 352px, rgba(30,26,37,0) 430px); }
.home-title { font-size: clamp(32px, 9vw, 40px); margin-top: 96px; line-height: 1.05; }
.home-sub { font-size: 17px; color: var(--muted); max-width: 30ch; margin: 0; }

.preview { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: var(--line); border: 2px solid var(--line); flex: none; }
.readout { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.readout .cell { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.readout .k, .readout .note { font-size: 14px; color: var(--muted); }
.readout .v { font-family: var(--display); font-size: 22px; font-weight: 700; }

.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-weight: 700; border: 2px solid var(--accent); color: var(--accent); }
.notice { border-left: 4px solid var(--amber); background: var(--surface); padding: 12px 14px; border-radius: 0 12px 12px 0; max-width: none; }
.notice.hazard { border-left-color: var(--red); }
.notice.info { border-left-color: var(--accent); }

table.breakdown { width: 100%; border-collapse: collapse; font-size: 15px; }
table.breakdown td { padding: 9px 0; border-top: 1px solid var(--line); vertical-align: top; }
table.breakdown td:last-child { text-align: right; font-weight: 700; white-space: nowrap; padding-left: 10px; }

/* Timeline */
.tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { flex: 1; min-height: 40px; border: 0; border-radius: 999px; background: transparent; font-weight: 700; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.week-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.week-row .day { width: 92px; flex: none; }
.week-row .dots { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .hd { font-size: 13px; color: var(--muted); text-align: center; padding-bottom: 4px; }
.cal .cell { aspect-ratio: 1; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); padding: 4px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; font-size: 13px; cursor: pointer; }
.cal .cell.blank { visibility: hidden; }
.cal .cell.today { border-color: var(--accent); border-width: 2px; }
.cal .cell .dots { display: flex; gap: 3px; flex-wrap: wrap; }
.cal .cell .dot { width: 8px; height: 8px; }
.scorechip { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 34px; padding: 0 8px; box-sizing: border-box; border: 0; border-radius: 9px; flex: none; font: inherit; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; background: var(--none); color: var(--none-ink); }
.scorechip.green { background: var(--green); color: #2E2C29; } .scorechip.yellow { background: var(--amber); color: #2E2C29; } .scorechip.red { background: var(--red); color: #FFFFFF; }
button.scorechip { cursor: pointer; }
.week-row .dots { gap: 8px; }
.cal .cell { min-width: 0; overflow: hidden; aspect-ratio: auto; min-height: 66px; }
.cal .cell .dots { flex-direction: column; align-items: flex-start; gap: 2px; }
.cal .cell .scorechip { min-width: 0; height: 17px; padding: 0 3px; border-radius: 4px; font-size: 11px; line-height: 1; }
.monthhd { margin: 8px 0 4px; font-size: 16px; color: var(--muted); }
.cal .cell .more { font-size: 11px; color: var(--muted); }


/* Bottom navigation */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { min-height: 58px; border: 0; background: none; font-size: 12.5px; white-space: nowrap; font-weight: 700; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; z-index: 20; width: max-content; max-width: calc(100% - 40px); }
.wrow { padding: 14px 0; border-top: 1px solid var(--line); }
.wrow:first-child { border-top: 0; padding-top: 0; }
.wrow .name { font-weight: 700; margin-bottom: 8px; }
.code { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: 0.06em; overflow-wrap: anywhere; }
.attrib { font-size: 12px; color: var(--muted); text-align: center; margin: 28px auto 0; }
.attrib a { color: inherit; }

/* Patterns */
.fitmap svg { width: 100%; height: auto; display: block; overflow: visible; }
.fitmap .tick, .fitmap .qlabel { font-family: var(--body); fill: var(--muted); }
.fitmap .qlabel { font-size: 11px; font-weight: 700; }
.fitmap .qtag { font-family: var(--display); font-size: 13px; font-weight: 800; letter-spacing: 0.09em; }
.fitmap .tick { font-size: 11px; font-variant-numeric: tabular-nums; }
.fitmap .axtitle { font-family: var(--body); font-size: 12px; fill: var(--ink); }
.fitmap .gridline { stroke: var(--grid); stroke-width: 1; }
.fitmap .midline { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 3 4; }
.fitmap .pt { fill: var(--ink); cursor: pointer; }
.fitmap .pt.onbrand, .fitmap .ptlabel.onbrand { fill: #2E2C29; }
.fitmap .pt.sel { stroke: var(--surface); stroke-width: 2.5; paint-order: stroke; filter: drop-shadow(0 0 0 #2E2C29); }
.fitmap .tilelabel { font-family: var(--display); font-size: 16px; font-weight: 800; fill: var(--ink); }
.fitmap .axword { font-size: 12.5px; font-weight: 700; fill: var(--muted); }
.fitmap .ptlabel { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.fitmap .pt.sel { stroke: var(--ink); stroke-width: 2.5; }
.fitlegend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; font-size: 14px; }
.fitlegend > div { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
.fitlegend .sw { width: 16px; height: 16px; border-radius: 4px; flex: none; margin-top: 3px; box-shadow: inset 0 0 0 1px var(--line); }
.fitlegend .ltag { display: block; font-family: var(--display); font-size: 12px; font-weight: 800; letter-spacing: 0.09em; color: var(--ink); }
.fitdetail { border-top: 1px solid var(--line); padding-top: 12px; font-size: 15px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.fitdetail strong { font-family: var(--display); font-size: 17px; }
.bars { display: flex; flex-direction: column; gap: 12px; }
.brow { display: grid; grid-template-columns: 112px 1fr; gap: 4px 12px; align-items: center; }
.brow .bname { font-weight: 700; font-size: 15px; }
.brow .btrack { height: 12px; background: var(--grid); border-radius: 999px; overflow: hidden; }
.brow .bfill { height: 100%; background: var(--accent); border-radius: 999px; }
.brow .bnote { grid-column: 2; font-size: 13px; color: var(--muted); }
.brow.thin .bname { color: var(--muted); font-weight: 400; }
.brow .lane { position: relative; height: 22px; }
.brow .lbase { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--grid); border-radius: 2px; }
.brow .lenv { position: absolute; top: 4px; height: 14px; background: var(--band); border-radius: 999px; }
.brow .ldot { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--ink); border: 2px solid var(--surface); }
.brow .ldot.out { background: var(--flag); }
.brow .bnote.out { color: var(--flag); font-weight: 700; }
.keyline { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.keyline span { display: inline-flex; gap: 6px; align-items: center; }
.k-band { width: 22px; height: 10px; border-radius: 999px; background: var(--band); display: inline-block; }
.k-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); display: inline-block; }
.lede { font-size: 18px; }
.lede strong { font-family: var(--display); }
@media (max-width: 380px) { .brow { grid-template-columns: 92px 1fr; } .fitlegend { grid-template-columns: 1fr; } }

@media (prefers-reduced-motion: reduce) { .ring .progress, .ring .core { transition: none; } }
</style>
</head>
<body>
<div class="app">

<script>
'use strict';

/* =====================================================================
   SETTINGS — every rule, tier, and threshold lives here.
   Change a number here and the whole app follows.
   ===================================================================== */
// === CONFIG START
const CONFIG = {
  APP_VERSION: '2.0.0-alpha.22',

  // Paste your Google Apps Script web app URL here (see the setup guide).
  // Leave empty to run in demo mode: scans are saved on this phone only.
  API_URL: 'https://script.google.com/macros/s/AKfycbya4ntzgr_ZQ470Q0zLEvtdkYJFpX0wq6tkWpJqv79fk_dX2w3x0SigJkh91Y8ddd8rAA/exec',

  // Your email, sent with OpenStreetMap searches as their usage policy asks.
  CONTACT_EMAIL: 'appmospherics@gmail.com',

  // Sound: WELL Building Standard v2, Feature S02 Maximum Noise Levels, by kind of place.
  // Good = at or below WELL's average-level (Leq) limit; Caution = up to WELL's maximum-level (Lmax) limit;
  // Poor = above that. NIOSH 85 dBA is the automatic red everywhere.
  SOUND: {
    CAL_OFFSET_DB: 110,      // Calibrate: meter dBA minus raw dBFS (see the setup guide)
    SAMPLE_SECONDS: 5,
    WARMUP_MS: 400,          // ignore the microphone's first moments
    CATEGORIES: {
      1: { label: 'learning and speaking spaces', GOOD_MAX: 35, CAUTION_MAX: 45 },
      2: { label: 'enclosed spaces for concentration and rest', GOOD_MAX: 40, CAUTION_MAX: 50 },
      3: { label: 'open, dining and public spaces', GOOD_MAX: 45, CAUTION_MAX: 55 }
    },
    // Kind of place -> WELL category. Anything not listed uses category 3.
    PLACE_CATEGORY: {
      'School': 1,
      'Home': 2, 'Someone else’s home': 2, 'Other private place': 2, 'Library': 2, 'Office or workplace': 2,
      'Healthcare': 2, 'Place of worship': 2
    },
    DEFAULT_CATEGORY: 3,
    HAZARD_MIN: 85           // NIOSH: automatic red at 85 dBA and above, in every kind of place
  },

  // Light: camera estimate shown as tiers. Boundaries: Dark below 10 lux,
  // Dim below 50 (from 1.0), Moderate below 300 (EN 12464-1), Bright below 1,000, then Daylight.
  LIGHT: {
    SAMPLE_SECONDS: 3,
    SETTLE_MS: 800,          // let the camera's auto-exposure settle first
    // Best method: when the phone reports its camera exposure settings (most Android phones),
    // lux is worked out from exposure time, ISO and picture brightness (the standard exposure
    // equation), then corrected with a table of [raw estimate, meter lux] pairs, per kind of phone.
    // Brightness alone can't tell a lit room from outdoors, because the camera adjusts its
    // exposure to make both look similar.
    ASSUMED_APERTURE: 1.8,
    EXPOSURE_TO_LUX: {
      // Meter readings, Nov 2026: 5 lux indoors, 61 lux indoors, 5,600 lux outdoors.
      Android: [[170, 5], [584, 61], [14153, 5600]]
    },
    EXPOSURE_SLOPE: 1.55,      // log-log slope fitted to those readings, used beyond the ends of the table
    MAX_LUX: 150000,
    // Fallback: lux from the picture's average brightness (0–1) alone, using a table of
    // [brightness, lux] pairs from calibration readings, darkest to brightest, per kind of phone.
    // The raw brightness is saved with every scan, so these tables can be improved later
    // and past scans recalculated.
    LUMA_TO_LUX: {
      // Generic starting table (not yet calibrated against a meter).
      iOS: [[0.004, 2], [0.02, 12], [0.06, 45], [0.15, 200], [0.3, 600], [0.5, 2000], [0.75, 12000]],
      // Android: 0.0606 -> 5 lux and 0.2076 -> 61 lux are calibration readings (Nov 2026).
      // The points above 0.2076 are provisional until daylight readings are added.
      Android: [[0.01, 0.4], [0.0606, 5], [0.2076, 61], [0.4, 600], [0.6, 3000], [0.8, 12000]],
      Other: [[0.004, 2], [0.02, 12], [0.06, 45], [0.15, 200], [0.3, 600], [0.5, 2000], [0.75, 12000]]
    },
    TIERS: [
      { name: 'Dark', below: 10 },
      { name: 'Dim', below: 50 },
      { name: 'Moderate', below: 300 },
      { name: 'Bright', below: 1000 },
      { name: 'Daylight', below: Infinity }
    ],
    POINTS: { Dark: null, Dim: 0, Moderate: 50, Bright: 100, Daylight: 100 } // Dark: recorded, not scored
  },

  // CO2: Aranet4 consumer tiers, plus an appmospherics Fail tier (hazard).
  CO2: { GOOD_BELOW: 1000, AVERAGE_MAX: 1400, UNHEALTHY_MAX: 2000 },

  // Stoplight cutoffs: PROVISIONAL thirds until there's enough data.
  STOPLIGHT: { GREEN_MIN: 67, YELLOW_MIN: 34 },
  HAZARD_SCORE_CAP: 33,              // hazards force red and cap the score here

  // Low confidence when fewer than this many of the 9 scored measures are answered.
  LOW_CONFIDENCE_MIN_ANSWERED: 5,

  // Patterns on the Timeline. The fit map works from the first scan; the other views wait for enough data.
  PATTERNS: { MIN_SCANS: 10, MIN_PER_MEASURE: 10, COMFORT_MIN: 65, MIN_COMFORTABLE: 4, SPLIT: 50 },

  NEARBY_RADIUS_M: 250,              // widened automatically when the phone's location is imprecise, up to 600 m
  DEFAULT_WEIGHT: 2                  // 0 = off, 3 = matters a lot
};
// === CONFIG END

/* =====================================================================
   SCORING — pure functions, tested separately from the screens
   ===================================================================== */
// === SCORING START
const METRICS = [
  { key: 'sound', label: 'Sound' },
  { key: 'light', label: 'Light' },
  { key: 'thermal', label: 'Thermal comfort' },
  { key: 'social', label: 'Social load (crowding)' },
  { key: 'smell', label: 'Smell' },
  { key: 'seat', label: 'Seat comfort' },
  { key: 'nature', label: 'Window and nature view' },
  { key: 'co2', label: 'Air quality (CO₂)' },
  { key: 'stress', label: 'Stress (Garmin)' }
];
const isNum = v => typeof v === 'number' && isFinite(v);
// ASHRAE 7-point thermal sensation scale. Recorded with each scan, never scored.
const SENSATION = [[-3, 'Cold'], [-2, 'Cool'], [-1, 'Slightly cool'], [0, 'Neutral'], [1, 'Slightly warm'], [2, 'Warm'], [3, 'Hot']];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// The WELL sound category for a scan, from the kind of place.
function soundCategory(s) {
  const kind = (s && s.place && s.place.type) || (s && s.private_type) || '';
  return CONFIG.SOUND.PLACE_CATEGORY[kind] || CONFIG.SOUND.DEFAULT_CATEGORY;
}
function soundTier(db, category) {
  if (!isNum(db)) return null;
  const S = CONFIG.SOUND, c = S.CATEGORIES[category || S.DEFAULT_CATEGORY];
  if (db >= S.HAZARD_MIN) return 'Fail';
  if (db <= c.GOOD_MAX) return 'Good';
  if (db <= c.CAUTION_MAX) return 'Caution';
  return 'Poor';
}
// Good = 100. Caution slides 66 to 34. Poor slides 33 to 0.
function soundPoints(db, category) {
  if (!isNum(db)) return null;
  const S = CONFIG.SOUND, c = S.CATEGORIES[category || S.DEFAULT_CATEGORY];
  if (db <= c.GOOD_MAX) return 100;
  if (db <= c.CAUTION_MAX) return 66 - (db - c.GOOD_MAX) / (c.CAUTION_MAX - c.GOOD_MAX) * 32;
  if (db < S.HAZARD_MIN) return 33 - (db - c.CAUTION_MAX) / (S.HAZARD_MIN - c.CAUTION_MAX) * 33;
  return 0;
}
function lightTier(lux) {
  if (!isNum(lux) || lux < 0) return null;
  for (const t of CONFIG.LIGHT.TIERS) if (lux < t.below) return t.name;
  return CONFIG.LIGHT.TIERS[CONFIG.LIGHT.TIERS.length - 1].name;
}
function co2Tier(ppm) {
  if (!isNum(ppm)) return null;
  const C = CONFIG.CO2;
  if (ppm < C.GOOD_BELOW) return 'Good';
  if (ppm <= C.AVERAGE_MAX) return 'Average';
  if (ppm <= C.UNHEALTHY_MAX) return 'Unhealthy';
  return 'Fail';
}

// Per measure: answered (counts toward confidence) and points (0–100, or null when not scored).
function metricResults(s) {
  const pts = (answered, p) => ({ answered, points: isNum(p) ? Math.round(clamp(p, 0, 100)) : null });
  const r = {};
  r.sound = pts(isNum(s.sound_dba), soundPoints(s.sound_dba, soundCategory(s)));
  const lp = s.light_tier ? CONFIG.LIGHT.POINTS[s.light_tier] : null;
  r.light = pts(!!s.light_tier, lp);
  r.thermal = pts(isNum(s.thermal), s.thermal);
  r.social = pts(isNum(s.social), isNum(s.social) ? (7 - s.social) / 6 * 100 : null); // 1 uncrowded (100 points) to 7 crowded (0 points), from 2.0.0-alpha.5 on
  r.smell = s.smell_none ? pts(true, null) : pts(isNum(s.smell), s.smell);
  r.seat = s.seat === 'na' ? pts(true, null) : pts(isNum(s.seat), isNum(s.seat) ? s.seat * 10 : null);
  if (s.window === 'no') r.nature = pts(true, 0);
  else if (s.window === 'yes' || s.window === 'outdoors') r.nature = pts(true, s.nature === 'yes' ? 100 : 50);
  else r.nature = pts(false, null);
  const ct = co2Tier(s.co2);
  r.co2 = pts(ct != null, ct == null ? null : ({ Good: 100, Average: 50, Unhealthy: 0, Fail: 0 })[ct]);
  r.stress = pts(isNum(s.stress), isNum(s.stress) ? garminStressPoints(s.stress) : null);
  return r;
}
function weightedMean(results, weights) {
  let sum = 0, wsum = 0;
  for (const m of METRICS) {
    const p = results[m.key].points;
    let w = 1;
    if (weights) w = isNum(weights[m.key]) ? weights[m.key] : CONFIG.DEFAULT_WEIGHT;
    if (p == null || w <= 0) continue;
    sum += p * w; wsum += w;
  }
  return wsum > 0 ? sum / wsum : null;
}
function hazardsFor(s) {
  const h = [];
  if (isNum(s.sound_dba) && s.sound_dba >= CONFIG.SOUND.HAZARD_MIN)
    h.push(`Sound at ${Math.round(s.sound_dba)} dBA is at or above the ${CONFIG.SOUND.HAZARD_MIN} dBA hearing-safety limit.`);
  if (isNum(s.co2) && s.co2 > CONFIG.CO2.UNHEALTHY_MAX)
    h.push(`CO₂ at ${Math.round(s.co2)} ppm is above ${CONFIG.CO2.UNHEALTHY_MAX.toLocaleString('en-US')} ppm.`);
  return h;
}
function stoplightFor(score, hazard) {
  if (hazard) return 'red';
  if (!isNum(score)) return 'none';
  if (score >= CONFIG.STOPLIGHT.GREEN_MIN) return 'green';
  if (score >= CONFIG.STOPLIGHT.YELLOW_MIN) return 'yellow';
  return 'red';
}
// placeScore: equal weights, the same for everyone. yourScore: this person's weights.
// Garmin's own stress bands: 0–25 resting, 26–50 low, 51–75 medium, 76–100 high.
// Scored by band so the app agrees with the watch: resting and low stress are Good, medium is Caution, high is Poor.
const GARMIN_STRESS = [[25, 'Resting', 100], [50, 'Low', 80], [75, 'Medium', 50], [100, 'High', 15]];
const garminBand = v => GARMIN_STRESS.find(b => v <= b[0]) || GARMIN_STRESS[GARMIN_STRESS.length - 1];
const garminStressPoints = v => garminBand(v)[2];
function scoreScan(s, weights) {
  const results = metricResults(s);
  const answered = METRICS.filter(m => results[m.key].answered).length;
  const hazards = hazardsFor(s);
  const hz = hazards.length > 0;
  const finish = v => (v == null ? null : Math.round(hz ? Math.min(v, CONFIG.HAZARD_SCORE_CAP) : v));
  const placeScore = finish(weightedMean(results, null));
  const yourScore = finish(weightedMean(results, weights));
  return {
    results, answered, hazards,
    lowConfidence: answered < CONFIG.LOW_CONFIDENCE_MIN_ANSWERED,
    placeScore, placeLight: stoplightFor(placeScore, hz),
    yourScore, yourLight: stoplightFor(yourScore, hz)
  };
}
// Camera brightness (0–1) to lux, interpolating the calibration table on a log scale.
function lumaToLux(luma, platform) {
  const T = CONFIG.LIGHT.LUMA_TO_LUX[platform] || CONFIG.LIGHT.LUMA_TO_LUX.Other;
  if (!isNum(luma) || luma < 0) return null;
  if (luma <= T[0][0]) return T[0][1] * (luma / T[0][0]);
  for (let i = 1; i < T.length; i++) {
    if (luma <= T[i][0]) {
      const f = (luma - T[i - 1][0]) / (T[i][0] - T[i - 1][0]);
      return Math.exp(Math.log(T[i - 1][1]) + f * (Math.log(T[i][1]) - Math.log(T[i - 1][1])));
    }
  }
  return T[T.length - 1][1];
}
// Camera exposure settings to lux. Raw estimate from the exposure equation
// (EV100 = log2(N²/t) − log2(ISO/100); lux ≈ 2.5 × 2^EV100 × brightness/0.18),
// then corrected with the phone type's calibration table on a log scale.
function rawExposureLux(luma, exposureTime, iso) {
  if (!isNum(luma) || !(exposureTime > 0) || !(iso > 0)) return null;
  const seconds = exposureTime * 1e-4; // reported in units of 100 microseconds
  const ev100 = Math.log2(CONFIG.LIGHT.ASSUMED_APERTURE ** 2 / seconds) - Math.log2(iso / 100);
  return 2.5 * Math.pow(2, ev100) * (Math.max(luma, 1e-4) / 0.18);
}
function exposureLux(luma, exposureTime, iso, platform) {
  const raw = rawExposureLux(luma, exposureTime, iso);
  if (raw == null) return null;
  const T = CONFIG.LIGHT.EXPOSURE_TO_LUX[platform];
  if (!T) return null; // no calibration for this kind of phone yet: use the brightness table
  const k = CONFIG.LIGHT.EXPOSURE_SLOPE, L = Math.log;
  let y;
  if (raw <= T[0][0]) y = L(T[0][1]) + k * (L(raw) - L(T[0][0]));
  else if (raw >= T[T.length - 1][0]) y = L(T[T.length - 1][1]) + k * (L(raw) - L(T[T.length - 1][0]));
  else for (let i = 1; i < T.length; i++) if (raw <= T[i][0]) {
    const f = (L(raw) - L(T[i - 1][0])) / (L(T[i][0]) - L(T[i - 1][0]));
    y = L(T[i - 1][1]) + f * (L(T[i][1]) - L(T[i - 1][1])); break;
  }
  return Math.min(Math.exp(y), CONFIG.LIGHT.MAX_LUX);
}
const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const CODE_PATTERN = /^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$/;
function normalizeCode(raw) {
  const c = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const code = c.length === 12 ? `${c.slice(0, 4)}-${c.slice(4, 8)}-${c.slice(8)}` : null;
  return code && CODE_PATTERN.test(code) ? code : null;
}
function localISO(d) {
  const pad = n => String(Math.floor(Math.abs(n))).padStart(2, '0');
  const off = -d.getTimezoneOffset();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${off >= 0 ? '+' : '-'}${pad(off / 60)}:${pad(off % 60)}`;
}
// Patterns: correlation, comfortable ranges and fit-map quadrants, all worked out on the device from your own scans.
function pearson(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
}
const linkStrength = r => !isNum(r) ? null : Math.abs(r) >= 0.5 ? 'strong' : Math.abs(r) >= 0.3 ? 'moderate' : Math.abs(r) >= 0.15 ? 'some' : 'little';
function quantile(a, q) { const s = a.slice().sort((x, y) => x - y); const i = (s.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i); return s[lo] + (s[hi] - s[lo]) * (i - lo); }
const fitQuadrant = (score, comfort) => score >= CONFIG.STOPLIGHT.GREEN_MIN ? (comfort >= CONFIG.PATTERNS.SPLIT ? 'match' : 'hidden') : (comfort >= CONFIG.PATTERNS.SPLIT ? 'despite' : 'avoid');
// One point per scan that has both a comfort rating and a place score.
function patternPoints(scans) {
  return scans.filter(s => isNum(s.overall_comfort)).map(s => {
    const sc = scoreScan(s, null);
    return sc.placeScore == null ? null : { scan: s, score: sc.placeScore, comfort: s.overall_comfort, results: sc.results, q: fitQuadrant(sc.placeScore, s.overall_comfort) };
  }).filter(Boolean);
}
// How closely each measure moves with comfort. r is null until a measure has enough scans.
function measureLinks(points) {
  return METRICS.map(m => {
    const pts = points.filter(p => p.results[m.key].points != null);
    const r = pts.length >= CONFIG.PATTERNS.MIN_PER_MEASURE ? pearson(pts.map(p => p.results[m.key].points), pts.map(p => p.comfort)) : null;
    return { key: m.key, label: m.label, n: pts.length, r };
  });
}
// The range of each measure (10th to 90th percentile) across scans where you felt comfortable.
function comfortRange(points, key) {
  const v = points.filter(p => p.comfort >= CONFIG.PATTERNS.COMFORT_MIN && p.results[key].points != null).map(p => p.results[key].points);
  return v.length >= CONFIG.PATTERNS.MIN_COMFORTABLE ? [quantile(v, 0.1), quantile(v, 0.9)] : null;
}
// === SCORING END

/* =====================================================================
   STORAGE (this phone) — never throws, so private browsing can't break the app
   ===================================================================== */
const store = {
  get(k, fallback) { try { const v = localStorage.getItem('am2.' + k); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(k, v) { try { localStorage.setItem('am2.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  remove(k) { try { localStorage.removeItem('am2.' + k); } catch (e) {} }
};
function newCode() {
  const bytes = new Uint8Array(12);
  crypto.getRandomValues(bytes);
  let s = '';
  for (let i = 0; i < 12; i++) { s += CODE_ALPHABET[bytes[i] % CODE_ALPHABET.length]; if (i === 3 || i === 7) s += '-'; }
  return s;
}
function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16); crypto.getRandomValues(b);
  return Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
}
function defaultWeights() { const w = {}; METRICS.forEach(m => (w[m.key] = CONFIG.DEFAULT_WEIGHT)); return w; }
function cleanWeights(raw) {
  const w = defaultWeights();
  if (raw && typeof raw === 'object') METRICS.forEach(m => { const v = raw[m.key]; if (isNum(v)) w[m.key] = clamp(Math.round(v), 0, 3); });
  return w;
}
const validScan = s => s && typeof s === 'object' && typeof s.scan_id === 'string' && typeof s.timestamp_local === 'string' && !isNaN(new Date(s.timestamp_local));

const state = {
  userId: normalizeCode(store.get('userId', null)),
  consented: store.get('consented', false) === true,
  installSeen: store.get('installSeen', false) === true,
  cityAsked: store.get('citySkipped', false) === true,
  city: String(store.get('city', '') || ''),
  weights: cleanWeights(store.get('weights', null)),
  scans: (Array.isArray(store.get('scans', [])) ? store.get('scans', []) : []).filter(validScan), // full history with dates: this phone only
  draft: null
};
function saveScans() { if (!store.set('scans', state.scans)) toast('This phone’s storage is full or blocked, so this scan may not stay in your timeline.'); }
function ensureUser() { if (!state.userId) { state.userId = newCode(); store.set('userId', state.userId); } return state.userId; }
function saveDraft() { if (state.draft) store.set('draft', { at: Date.now(), draft: state.draft }); else store.remove('draft'); }
function savedDraft() { const d = store.get('draft', null); return d && d.draft && Date.now() - d.at < 30 * 60 * 1000 ? d.draft : null; }

/* =====================================================================
   DATA LAYER — the only code that talks to the backend.

/* Question building blocks. Each reports null when unanswered. */

/* =====================================================================

   ===================================================================== */
const routes = {};

      h('h1', {}, 'Before you start'),
      h('p', {}, 'appmospherics helps you discover which environments help you feel your best.'),
      h('div', { class: 'panel' }, h('ul', { class: 'keypoints' },
        h('li', {}, h('strong', {}, 'No name, email or login. '), 'Your scans are linked to a random code, not to you.'),
        h('li', {}, h('strong', {}, 'No audio or images are saved. '), 'Room readings use the microphone and camera for a few seconds and keep only the sound and light levels.'),
        h('li', {}, h('strong', {}, 'We save the place you choose, not where your phone is. '), 'Your phone’s location is used only if you ask for nearby places. It goes to the map service to find them, and we never save it.'),
        h('li', {}, h('strong', {}, 'Other people can’t see your timeline. '), 'We can see scans in our records, linked only to your random code. Anything shared or published combines many people’s scans.'),
        h('li', {}, h('strong', {}, 'You can delete your scans '), 'anytime in Settings.'))),

  }

    const steps = ios

    return mount(null, h('section', { class: 'stack' },
      h('h1', {}, 'Add appmospherics to your home screen'),
      h('p', {}, 'It opens like an app and helps preserve your history on this phone. Do this before your first scan so your scans stay together.'),
      h('div', { class: 'panel' }, h('ol', {}, steps.map(t => h('li', {}, t)))),

/* ---------------- Scan ---------------- */
function emptyDraft() {

}

routes['scan-place'] = () => {

    ? places.map(p => h('button', { type: 'button', class: 'listitem', onclick: () => choose(p) },
        h('span', { class: 'grow' }, h('span', { class: 'title' }, p.name), h('span', { class: 'sub' }, [p.type, p.address].filter(Boolean).join(', ')))))
    : h('p', {}, 'No matches. Try another name, or type the place in below.'));

  const search = guard(async () => {
    const term = q.value.trim();
    if (!term) { q.focus(); return; }

routes['scan-reading'] = () => {
  const d = state.draft;
  const r = ring({ big: 'Ready', label: 'Room reading' });
  const preview = h('video', { class: 'preview hidden', playsinline: true, muted: true, 'aria-hidden': 'true' });
  preview.muted = true;
  const status = h('p', { class: 'muted', role: 'status' }, 'Hold your phone at eye level with the back camera facing the room, not a lamp or window. Stay quiet for five seconds.');
  const out = h('div', { class: 'stack' });
  const startBtn = h('button', { type: 'button', class: 'btn wide', onclick: run }, 'Start room reading');
  const nextBtn = h('button', { type: 'button', class: 'btn wide hidden', onclick: () => go('scan-questions') }, 'Next');
  const skip = h('button', { type: 'button', class: 'linkbtn', onclick: () => go('scan-questions') }, 'Skip the reading');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function showReadout(res) {
    const cell = (k, v, note) => h('div', { class: 'cell' }, h('div', { class: 'k' }, k), h('div', { class: 'v' }, v), h('div', { class: 'note' }, note));
    fill(out,
      h('div', { class: 'readout' },
        cell('Sound', isNum(d.sound_dba) ? `${Math.round(d.sound_dba)} dBA` : 'No reading', isNum(d.sound_dba) ? `${soundTier(d.sound_dba, soundCategory(d))} for this kind of place, estimated` : (res && res.soundError ? sensorMessage(res.soundError, 'Microphone') : '')),
        cell('Light', d.light_tier || 'No reading', d.light_tier ? 'Estimated by the camera' : (res && res.lightError ? sensorMessage(res.lightError, 'Camera') : ''))),
      res && res.clipped && h('p', { class: 'notice small' }, 'The sound was loud enough to overload this phone’s microphone, so the real level may be higher than shown.'),
      res && (res.soundError || res.lightError) && h('p', { class: 'muted small' }, 'To include a missing reading, allow the microphone and camera for this site in your browser settings, then read again. You can also continue without it.'),
      res && CALIBRATE && h('p', { class: 'notice info small' }, `Calibration values. Raw sound: ${res.dbfs != null ? res.dbfs.toFixed(1) : '–'} dBFS. Brightness: ${res.luma != null ? res.luma.toFixed(4) : '–'}. Lux estimate: ${res.lux != null ? Math.round(res.lux) : '–'} (${res.method || 'none'}). Phone: ${DEVICE_PLATFORM}.${res.exposureTime ? ` Exposure: ${res.exposureTime}, ISO ${res.iso ?? '–'}.` : ''}`));
  }
  async function run() {
    startBtn.disabled = true; skip.classList.add('hidden'); nextBtn.classList.add('hidden'); fill(out);
    status.textContent = 'Reading the room. Hold still and stay quiet…';
    preview.classList.remove('hidden');

    const reading = startReading(preview, ({ progress, liveDb }) => {
      r.setProgress(progress);
      if (liveDb != null) {
        r.setBig(`${Math.round(clamp(liveDb, 20, 130))} dBA`);

      }

    setDraft({
      sound_dba: isNum(res.dba) ? Math.round(res.dba * 10) / 10 : null,
      light_lux_est: isNum(res.lux) ? Math.round(res.lux) : null,
      light_tier: lightTier(res.lux),
      light_method: res.method,

  }

    h('div', {}, stepLabel(3), h('h1', {}, 'Room reading')),
    h('div', { class: 'ring-wrap' }, r.node),
    h('div', { class: 'row' }, preview, status),
    out, nextBtn, startBtn, skip, cancelLink()));
};

function fitMapPanel(points) {
  if (!points.length) {
    return h('div', { class: 'panel stack' },
      h('p', {}, 'Your places appear here after your first scan: how each place measured, against how you felt there.'),
      h('div', {}, h('button', { type: 'button', class: 'btn', onclick: () => beginScan() }, 'Start a scan')));
  }
  // Summary sentence, worked out from your own scans
  let lede;
  if (points.length >= 5) {
    const r = pearson(points.map(p => p.score), points.map(p => p.comfort));
    const word = { strong: 'closely', moderate: 'fairly closely', some: 'a little', little: 'only loosely' }[linkStrength(r)];
    lede = word ? [document.createTextNode('Your comfort follows how places measure '), h('strong', {}, word), document.createTextNode('.')] : [document.createTextNode('Your comfort ratings have been very similar so far.')];
  } else lede = [document.createTextNode(`After 5 scans, this will say how closely your comfort follows the measurements. You have ${points.length}.`)];
  const places = q => [...new Set(points.filter(p => p.q === q).map(p => placeName(p.scan)))];
  const hiddenAt = places('hidden'), despiteAt = places('despite');
  if (hiddenAt.length) lede.push(document.createTextNode(` ${listText(hiddenAt)} measured well but felt off at least once, so something there may not be measured.`));
  if (despiteAt.length) lede.push(document.createTextNode(` ${listText(despiteAt)} measured poorly but felt good.`));

  // The map: four soft tiles, split at Good (67) for how a place measured and at 50 for how you felt. Only the two clear corners are named (Best fit, Worst fit).
  // One dot per place (its average), except home, where every scan is its own house.
  const S = CONFIG.PATTERNS.SPLIT, G = CONFIG.STOPLIGHT.GREEN_MIN; // felt-good line at 50; measured-well line at Good (67)
  const x = v => v < G ? 40 + (v / G) * 133 : 205 + ((v - G) / (100 - G)) * 133;
  const y = v => v >= S ? 202 - ((v - S) / (100 - S)) * 140 : 400 - (v / S) * 140;
  const svg = svgNode('svg', { viewBox: '0 0 350 420', role: 'img', 'aria-label': 'Your places, placed by how each measured and how you felt there' });
  [[28, 24, 'var(--bg)'], [193, 24, 'var(--brand)'], [28, 222, 'var(--worst)'], [193, 222, 'var(--bg)']].forEach(([rx, ry, f]) =>
    svg.append(svgNode('rect', { x: rx, y: ry, width: 157, height: 190, rx: 16, style: `fill:${f}` })));
  svg.append(svgNode('text', { class: 'tilelabel', x: 205, y: 48, style: 'fill:#2E2C29' }, 'Best fit'));
  svg.append(svgNode('text', { class: 'tilelabel', x: 40, y: 246 }, 'Worst fit'));
  svg.append(svgNode('text', { class: 'axword', x: 106, y: 15, 'text-anchor': 'middle' }, 'Measured poorly'));
  svg.append(svgNode('text', { class: 'axword', x: 271, y: 15, 'text-anchor': 'middle' }, 'Measured well'));
  svg.append(svgNode('text', { class: 'axword', transform: 'translate(15 119) rotate(-90)', 'text-anchor': 'middle' }, 'Felt good'));
  svg.append(svgNode('text', { class: 'axword', transform: 'translate(15 317) rotate(-90)', 'text-anchor': 'middle' }, 'Felt off'));
  const avg = a => Math.round(a.reduce((t, v) => t + v, 0) / a.length);
  const isHome = p => p.scan.private_type === 'Home';
  const groups = {};
  points.filter(p => !isHome(p)).forEach(p => { const k = placeName(p.scan); (groups[k] = groups[k] || []).push(p); });
  const marks = Object.entries(groups).map(([name, ps]) => ({ name, ps, home: false, score: avg(ps.map(p => p.score)), comfort: avg(ps.map(p => p.comfort)) }))
    .concat(points.filter(isHome).map(p => ({ name: 'Home', ps: [p], home: true, score: p.score, comfort: p.comfort })));
  const detail = h('div', { class: 'fitdetail', 'aria-live': 'polite' });
  const latest = ps => ps.slice().sort((a, b) => new Date(b.scan.timestamp_local) - new Date(a.scan.timestamp_local))[0];
  const showDetail = m => {
    const p = latest(m.ps), d = new Date(p.scan.timestamp_local);
    fill(detail,
      h('div', {}, h('strong', {}, m.name), m.home ? ` ${fmtDay(d, { weekday: 'short', month: 'short', day: 'numeric' })}, ${fmtTime(d)}` : ` · ${plural(m.ps.length, 'scan')}`),
      h('div', {}, m.home || m.ps.length === 1 ? `Place score ${m.score}. You felt ${m.comfort} of 100.` : `On average: place score ${m.score}, you felt ${m.comfort} of 100.`),
      h('button', { type: 'button', class: 'linkbtn', onclick: () => go('result', { id: p.scan.scan_id }) }, m.home || m.ps.length === 1 ? 'Open this scan' : 'Open the latest scan'));
  };
  const nodes = marks.map(m => {
    const cx = x(m.score), cy = y(m.comfort), onb = m.score >= G && m.comfort >= S ? ' onbrand' : '';
    const node = m.home
      ? svgNode('path', { class: 'pt home' + onb, d: `M${cx - 8} ${cy}L${cx} ${cy - 8}L${cx + 8} ${cy}V${cy + 8}H${cx - 8}Z` })

    const pick = () => { nodes.forEach(o => o.node.classList.remove('sel')); node.classList.add('sel'); tl.selected = latest(m.ps).scan.scan_id; showDetail(m); };
    node.addEventListener('click', pick);
    node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    svg.append(node);
    if (!m.home) {
      const right = m.score >= G ? cx > 271 : cx > 106; // label away from the tile edge
      svg.append(svgNode('text', { class: 'ptlabel' + onb, x: right ? cx - 11 : cx + 11, y: cy + 4, 'text-anchor': right ? 'end' : 'start' }, m.name.length > 18 ? m.name.slice(0, 17) + '…' : m.name));
    }

  const key = h('p', { class: 'muted small', style: 'margin:0' }, 'Each dot is one of your places. ', points.some(isHome) ? 'Each house is one scan at home. ' : '', 'Tap one for details.');
  return h('div', { class: 'panel stack fitmap' }, h('p', { class: 'lede' }, lede), svg, key, detail);
}

  const shift = dir => { const d = new Date(a); if (tl.mode === 'day') d.setDate(d.getDate() + dir); else if (tl.mode === 'week') d.setDate(d.getDate() + 7 * dir); else d.setMonth(d.getMonth() + dir, 1); tl.anchor = d; redraw(); };
  const light = s => scoreScan(s, state.weights).yourLight;
  let title, body;
  if (tl.mode === 'all') {
    const all = state.scans.slice().sort((x, y) => new Date(y.timestamp_local) - new Date(x.timestamp_local));
    const groups = [];
    all.forEach(s => { const d = new Date(s.timestamp_local), k = d.getFullYear() + '-' + d.getMonth(); if (!groups.length || groups[groups.length - 1].k !== k) groups.push({ k, d, list: [] }); groups[groups.length - 1].list.push(s); });
    body = h('div', { class: 'stack' }, h('p', { class: 'muted small', style: 'margin:0' }, `${plural(all.length, 'scan')}, newest first.`),
      groups.map(g => h('div', {}, h('h3', { class: 'monthhd' }, fmtDay(g.d, { month: 'long', year: 'numeric' })), h('div', {}, g.list.map(scanListItem)))));
  } else if (tl.mode === 'day') {
    title = fmtDay(a, { weekday: 'long', month: 'long', day: 'numeric' });
    const list = byDay[dateKey(a)] || [];
    body = list.length ? h('div', {}, list.map(scanListItem)) : h('p', { class: 'muted' }, 'No scans this day.');
  } else if (tl.mode === 'week') {
    const start = new Date(a); start.setDate(a.getDate() - ((a.getDay() + 6) % 7)); // weeks start Monday
    title = `Week of ${fmtDay(start, { month: 'long', day: 'numeric' })}`;
    body = h('div', {}, Array.from({ length: 7 }, (_, i) => {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const list = byDay[dateKey(d)] || [];
      return h('div', { class: 'week-row' },
        h('button', { type: 'button', class: 'linkbtn day', onclick: () => openDay(d) }, fmtDay(d, { weekday: 'short', day: 'numeric' })),
        h('div', { class: 'dots' }, list.length
          ? list.map(s => { const sc = scoreScan(s, state.weights); return h('button', { type: 'button', class: 'scorechip ' + (sc.yourScore == null ? '' : sc.yourLight), 'aria-label': `${placeName(s)}, ${sc.yourScore == null ? 'no score' : `score ${sc.yourScore}, ${lightWord(sc.yourLight)}`}`, onclick: () => go('result', { id: s.scan_id }) }, sc.yourScore == null ? '–' : String(sc.yourScore)); })
          : h('span', { class: 'muted small' }, 'No scans')));
    }));
  } else {
    const first = new Date(a.getFullYear(), a.getMonth(), 1);
    const daysIn = new Date(a.getFullYear(), a.getMonth() + 1, 0).getDate();
    const todayKey = dateKey(new Date());
    title = fmtDay(first, { month: 'long', year: 'numeric' });
    const cells = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => h('div', { class: 'hd', 'aria-hidden': 'true' }, x));
    for (let i = 0; i < (first.getDay() + 6) % 7; i++) cells.push(h('div', { class: 'cell blank' }));
    for (let n = 1; n <= daysIn; n++) {
      const d = new Date(a.getFullYear(), a.getMonth(), n), k = dateKey(d), list = byDay[k] || [];
      cells.push(h('button', { type: 'button', class: 'cell' + (k === todayKey ? ' today' : ''), 'aria-label': `${fmtDay(d, { month: 'long', day: 'numeric' })}, ${plural(list.length, 'scan')}`, onclick: () => openDay(d) },
        h('span', {}, n), h('span', { class: 'dots', 'aria-hidden': 'true' }, list.slice(0, list.length > 2 ? 1 : 2).map(s => { const sc = scoreScan(s, state.weights); return h('span', { class: 'scorechip ' + (sc.yourScore == null ? '' : sc.yourLight) }, sc.yourScore == null ? '–' : String(sc.yourScore)); }), list.length > 2 && h('span', { class: 'more' }, '+' + (list.length - 1)))));
    }
    body = h('div', { class: 'cal' }, cells);
  }
  return [
    h('div', { class: 'tabs', role: 'group', 'aria-label': 'Calendar range' }, ['day', 'week', 'month', 'all'].map(m => h('button', { type: 'button', 'aria-pressed': String(tl.mode === m), onclick: () => { tl.mode = m; redraw(); } }, cap(m)))),
    tl.mode !== 'all' && h('div', { class: 'row spread' },
      h('button', { type: 'button', class: 'btn quiet compact', 'aria-label': 'Previous ' + tl.mode, onclick: () => shift(-1) }, '‹'),
      h('h3', { style: 'margin:0;text-align:center;flex:1' }, title),
      h('button', { type: 'button', class: 'btn quiet compact', 'aria-label': 'Next ' + tl.mode, onclick: () => shift(1) }, '›')),
    state.scans.length ? body : h('div', { class: 'panel stack' }, h('p', {}, 'No scans yet. Your first scan will appear here.'), h('div', {}, h('button', { type: 'button', class: 'btn', onclick: () => beginScan() }, 'Start a scan'))),
    h('p', { class: 'muted small' }, 'Each box shows your score and its level: lavender is Good, gray is Caution, charcoal is Poor. Scores use your What matters settings. Only you can see your history.')
  ];
}

/* ---------------- Settings ---------------- */
routes.settings = () => {
  const city = h('input', { type: 'text', id: 'scity', value: state.city, placeholder: 'For example, Denver', maxlength: 80 });
  const codeIn = h('input', { type: 'text', id: 'rcode', placeholder: 'ABCD-EFGH-JKMN', autocapitalize: 'characters', autocomplete: 'off', spellcheck: 'false', maxlength: 20 });
  const codeShown = h('div', { class: 'code' }, state.userId || 'Created with your first scan');
  const msg = h('p', { class: 'small', role: 'status' });
  let busy = false;
  async function restore() {
    if (busy) return;
    const c = normalizeCode(codeIn.value);
    if (!c) { msg.textContent = 'That code isn’t in the right format. It looks like ABCD-EFGH-JKMN.'; return; }
    if (!api.enabled()) { msg.textContent = 'Restoring needs the backend, which isn’t connected in demo mode.'; return; }
    busy = true; msg.textContent = 'Restoring…';
    try {
      const data = await api.getMyScans(c);
      const found = (data.scans || []).filter(validScan);
      if (!found.length) { msg.textContent = 'No scans were found for that code. Check it and try again.'; return; }
      // Keep anything on this phone that hasn't reached the server yet, and attach it to the restored code.
      const ids = new Set(found.map(x => x.scan_id));
      const local = state.scans.filter(s => !s.synced && !ids.has(s.scan_id)).map(s => Object.assign(s, { user_id: c }));
      state.userId = c; store.set('userId', c);
      state.scans = found.map(x => Object.assign(x, { synced: true })).concat(local);
      saveScans();
      if (data.weights) { state.weights = cleanWeights(data.weights); store.set('weights', state.weights); }
      syncPending();
      codeShown.textContent = c; codeIn.value = '';
      msg.textContent = `Restored ${plural(found.length, 'scan')}.`;
    } catch (e) { msg.textContent = e.message || 'Restore didn’t work. Try again later.'; }
    finally { busy = false; }
  }
  async function removeAll() {
    if (!confirm('Delete all your scans and settings? This can’t be undone.')) return;
    try {
      if (api.enabled() && state.userId) await api.deleteMyData(state.userId);
      ['scans', 'weights', 'userId', 'draft'].forEach(k => store.remove(k));
      state.scans = []; state.weights = defaultWeights(); state.userId = null; state.draft = null;
      routes.settings(); toast('Your data was deleted');
    } catch (e) { toast('Delete didn’t go through. Check your connection and try again.'); }
  }
  mount('settings', h('section', { class: 'stack' },
    h('h1', {}, 'Settings'),
    h('div', { class: 'panel stack' }, h('h3', {}, 'Your city'),
      h('label', { class: 'muted small', for: 'scity' }, 'Used to find places when you search by name.'), city,
      h('button', { type: 'button', class: 'btn quiet', onclick: () => { state.city = city.value.trim(); store.set('city', state.city); toast('City saved'); } }, 'Save city')),
    h('div', { class: 'panel stack' }, h('h3', {}, 'Recovery code'),
      h('p', { class: 'muted small' }, 'Your history lives on this phone, so clearing your browser data or switching phones can lose it; your scans still count toward shared place data. This optional code brings your history to a new phone. Keep it private: anyone with it can see your timeline.'),
      codeShown,
      state.userId && navigator.clipboard && h('button', { type: 'button', class: 'btn quiet', onclick: () => navigator.clipboard.writeText(state.userId).then(() => toast('Code copied'), () => toast('Copying didn’t work. Write the code down instead.')) }, 'Copy code'),
      h('div', {}, h('label', { class: 'field', for: 'rcode' }, 'Restore history with a code'), codeIn),
      h('button', { type: 'button', class: 'btn quiet', onclick: restore }, 'Restore history'), msg),
    h('div', { class: 'panel stack' }, h('h3', {}, 'Privacy'),
      h('button', { type: 'button', class: 'linkbtn', onclick: () => go('policy') }, 'Read the privacy policy'),
      h('div', {}, h('button', { type: 'button', class: 'linkbtn', onclick: () => go('measures') }, 'How the measures and scores work')),
      h('div', {}, h('button', { type: 'button', class: 'btn danger', onclick: removeAll }, 'Delete all my data'))),
    h('p', { class: 'muted small' }, `Version ${CONFIG.APP_VERSION}${api.enabled() ? '' : ', demo mode'}`),
    h('p', { class: 'muted small' }, '© 2026 Meredith Banasiak LLC')));
};

      item('Light',
        `Estimated by your phone’s camera and shown as a range, not an exact number: Dark under ${L[0].below} lux, Dim ${L[0].below}–${L[1].below}, Moderate ${L[1].below}–${L[2].below}, Bright ${L[2].below}–${L[3].below.toLocaleString('en-US')}, Daylight over ${L[3].below.toLocaleString('en-US')} lux. Dark is recorded but not scored, because darkness is right for sleep. Phone cameras differ, so the estimate is approximate; the raw brightness is saved with each scan so it can be corrected later.`,
        'Sources: EN 12464-1, Lighting of work places (300 lux for reading tasks), one of the reference guidelines named in WELL Building Standard v2, Feature L02 Visual Lighting Design. Brown et al. (2022), Recommendations for daytime, evening, and nighttime indoor light exposure, PLOS Biology 20(3), e3001571, which informs the Daylight and Dark ranges, along with WELL v2 Feature L03 Circadian Lighting Design, which calls for bright, daylight-like light at eye level for at least four hours of the day. Both use a measure of light’s effect on the body’s clock, so the app’s ordinary brightness ranges are a simpler stand-in.'),
      item('Thermal comfort',

/* ---------------- Full privacy policy ---------------- */
const POLICY_EFFECTIVE = 'November 13, 2026';
routes.policy = () => {
  const sec = (title, ...paras) => h('div', {}, h('h2', {}, title), paras.map(t => h('p', {}, t)));
  const back = () => { if (history.length > 1) history.back(); else go('home', {}, true); };
  mount(state.consented ? 'settings' : null, h('section', { class: 'stack' },
    h('h1', {}, 'Privacy policy'),
    h('p', { class: 'muted' }, `appmospherics, operated by Meredith Banasiak LLC. Effective ${POLICY_EFFECTIVE}.`),
    h('p', {}, 'appmospherics measures the places you spend time, such as their sound, light, crowding and other conditions, and helps you learn which environments help you feel your best. This page explains what the app collects, what it does with it, and what it doesn’t do.'),
    sec('What we collect',
      'When you save a scan, the app saves: the place you chose; the date, time, day of the week and hour of the scan; the readings and ratings you measure or enter (overall comfort, sound level, light level, thermal comfort, how warm or cold it feels, social load, smell, seat comfort, and window and nature view, plus CO₂ and Garmin stress if you add them); the score and color the app calculates; and the app version used.',
      'With each room reading, we also save its technical details before conversion: the raw sound level, the picture’s average brightness, the camera’s exposure settings when your phone reports them, and whether your phone is an iPhone or Android (never the model). This lets us correct estimates later as calibration improves.',
      'For a public place, we save the venue’s name, type and city, and for places found on OpenStreetMap, the venue’s own public map location. For a private place, such as home, we save only the type of place, with no name or location.',
      'Each scan is linked to a random code created for your device. It doesn’t contain your name, email or contact details. If you change your What matters settings, they are also saved with your code so they can be restored.',
      'We don’t ask for your name, email address, phone number or a login.'),
    sec('Location',
      'What we save is the place you choose for each scan, such as a café, along with that place’s public map location when it comes from OpenStreetMap. Together, your scans form a record of the places you chose to scan and when, which is what powers your timeline.',
      'The app never tracks your phone’s location in the background. If you tap “Suggest places near me,” your phone’s location is sent once to a map service that uses OpenStreetMap data (Photon, run by komoot, or Overpass if Photon is unavailable) to find nearby places. If you then search by name before closing the app, a rounded location (to about 100 meters) goes with the search so nearby matches come first. It is not saved, and it is never sent to us. Searching by name sends the words you type and your city to OpenStreetMap.'),
    sec('Microphone and camera',
      'During a room reading, the app uses your microphone and camera for a few seconds to calculate a sound level and a light level. That processing happens on your device. No audio, photos or video are recorded, saved or sent anywhere. Only the resulting numbers are saved, and only if you save the scan.'),
    sec('Stored on your device',
      'Your timeline, your code, your city, your What matters settings and any unfinished scan are kept in your browser’s storage on your device. Clearing your browser data removes them from the device.'),
    sec('Who can see what',
      'Other people using appmospherics can’t see your timeline, unless you give them your code. We, as the operator, can see scans in our records, linked only to your random code, and use them as described below. Other people using the app may see combined information about public places: the place’s name and type, the number of scans, average scores, readings and colors, and the day of the week and hour of scans. They never see dates, your code or anything about private places.'),
    sec('How we use and share the data',
      'We use scans to show scores, to improve how scores are calculated, and for research on how built environments affect comfort and wellbeing. We may share or license combined, place-level information (readings and scores about places, not information about you) with other organizations, such as directories, travel and accessibility services, or research partners. We may publish research findings using combined data. We never share individual timelines, we don’t sell personal information, and we don’t use the data for advertising.'),
    sec('Service providers',
      'Scan data is stored in a private Google Sheet that only we can open, using Google Apps Script. The app is hosted by GitHub Pages, and its fonts are loaded from Google Fonts. Place search uses services built on OpenStreetMap data (Nominatim, Photon by komoot and Overpass). Like most web services, these providers may keep standard technical logs such as IP addresses, under their own privacy and security terms.'),
    sec('Keeping and removing data',
      'We keep scans for as long as the app operates, because the value of the data comes from comparing places over time. We may remove entries that look like spam or contain inappropriate content.',
      'You can delete your scans and settings at any time in Settings, using Delete all my data. This removes them from our records and from your device, and shared place summaries are rebuilt without them. Deletion works through your code, so if you clear your browser data or change phones without your recovery code, we can’t match older scans to you; contact us and we’ll help where we can. Deleted data may remain in our storage provider’s version history or backups for a limited time. Places you added to the map list, such as a café’s name, stay in the list because they aren’t about you.'),

    sec('Security',

    sec('Using appmospherics',
      'appmospherics is an experimental research tool provided as is, without warranties of any kind. Scores, colors and readings are estimates meant to help you notice patterns. They are not safety, health or accessibility certifications, and they are not medical or professional advice. Use your own judgment about where you go and how long you stay. To the extent allowed by law, Meredith Banasiak LLC is not liable for decisions made or harm arising from use of the app.'),
    sec('Changes',
      'If we change this policy, we’ll update the effective date above.'),
    sec('Contact',
      'Questions or requests about your data: appmospherics@gmail.com.'),
    h('button', { type: 'button', class: 'btn quiet wide', onclick: back }, 'Back')));
};
